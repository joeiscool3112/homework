<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Calculator</title>
  <link rel="stylesheet" href="./calc.css" />
</head>

<body>
  <main class="container">
    <h1 class="title">Mini Calculator</h1>

    <section class="card">
      <form id="calcForm" novalidate>
        <div class="row">
          <div class="field">
            <label for="a">Số A</label>
            <input id="a" name="a" type="number" inputmode="decimal" placeholder="Nhập số A" />
          </div>

          <div class="field">
            <label for="op">Phép toán</label>
            <select id="op" name="op">
              <option value="+">+</option>
              <option value="-">-</option>
              <option value="*">*</option>
              <option value="/">/</option>
            </select>
          </div>

          <div class="field">
            <label for="b">Số B</label>
            <input id="b" name="b" type="number" inputmode="decimal" placeholder="Nhập số B" />
          </div>
        </div>

        <div class="btns">
          <button type="submit" id="btnCalc">Calculate</button>
          <button type="button" id="btnReset">Reset</button>
        </div>

        <div id="output" class="msg" hidden></div>
      </form>
    </section>
  </main>

  <script src="./calc.js" defer></script>
</body>
</html>
