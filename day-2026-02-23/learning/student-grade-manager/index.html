<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Student Grade Manager</h1>
        </header>

        <main>
            <!-- Form -->
            <section class="form-section">
                <div class="card form-card">
                    <h2>Add Students</h2>
                    <form id="studentForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input id="name" type="text" placeholder="Nguyễn Văn A" required>
                            </div>
                            <div class="form-group">
                                <label for="age">Age</label>
                                <input id="age" type="number" min="15" max="100" placeholder="18" required>
                            </div>
                            <div class="form-group">
                                <label for="grade">Grade</label>
                                <input id="grade" type="number" min="0" max="100" step="0.1" placeholder="85.5" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Student</button>
                    </form>
                </div>
            </section>

            <div class="content-grid">
                <section class="table-section">
                    <div class="card">
                        <div class="table-header">
                            <h2>Student lists</h2>
                            <span id="countBadge" class="badge">0 student</span>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Age</th>
                                        <th>Grade</th>
                                        <th class="actions-col">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="studentTable"></tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <aside class="stats-section">
                    <div class="card stat-card">
                        <p class="stat-label">Total students</p>
                        <p id="totalStudents" class="stat-value">0</p>
                    </div>

                    <div class="card stat-card">
                        <p class="stat-label">Average score</p>
                        <p id="avgGrade" class="stat-value">0.00</p>
                    </div>

                    <div class="card stat-card">
                        <p class="stat-label">students with score >= 80</p>
                        <p id="highAchivers" class="stat-value">0</p>
                    </div>

                    <div class="card stat-card highlight">
                        <p class="stat-label">Highest score students</p>
                        <p id="highestStudent" class="stat-value highlight-value">No data</p>
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
